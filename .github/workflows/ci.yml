name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Format check
        run: test -z "$(gofmt -l .)" || { echo 'gofmt needed:'; gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Cross-compile
        run: |
          for t in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS="${t%/*}" GOARCH="${t#*/}" CGO_ENABLED=0 go build -o /dev/null ./cmd/zta
          done

      - name: Posture audit (gate the build)
        run: go run ./cmd/zta audit .

      - name: Guard smoke test (wired hook actually blocks)
        env:
          ZTA_LOG: off
        run: |
          # The posture audit only checks that `zta guard` is *wired*; this
          # verifies the binary, on PATH as the hook invokes it, actually
          # enforces — catching a hook that would silently no-op if zta were
          # missing or broken.
          go build -o "$RUNNER_TEMP/zta" ./cmd/zta
          export PATH="$RUNNER_TEMP:$PATH"
          code=0
          echo '{"tool_name":"Bash","tool_input":{"command":"git push --force"}}' \
            | zta guard --agent claude-code || code=$?
          test "$code" -eq 2 || { echo "denied op: expected block (exit 2), got $code"; exit 1; }
          code=0
          echo '{"tool_name":"Bash","tool_input":{"command":"npm test"}}' \
            | zta guard --agent claude-code || code=$?
          test "$code" -eq 0 || { echo "safe op: expected allow (exit 0), got $code"; exit 1; }
          echo "guard smoke test passed: denied op blocked, safe op allowed"
