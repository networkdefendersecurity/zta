name: zt-audit
# Verify layer: gates the build on the agent's zero-trust posture and the hook
# self-tests. Runs on every PR and push so a misconfigured agent can't ship.
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  posture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Hook self-tests
        run: bash tests/test_hooks.sh
      - name: Posture audit (fails the build on any FAIL)
        run: python3 zt-audit/zt_audit.py .
